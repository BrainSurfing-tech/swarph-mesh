[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarph-mesh"
version = "0.8.0"
description = "Model-agnostic Python substrate for the swarph-mesh ecosystem — the graph protocol third-party CLIs plug into. v0.8.0 adds the VibeCLIAdapter (provider 'vibe-cli'): the EU-domiciled SUBSCRIPTION Mistral lane via firejail-sandboxed `vibe -p`, with a --max-price hard cost ceiling enforced per call, no tools at all, an ephemeral VIBE_HOME (stateless by construction), the prompt piped on stdin so it never touches disk, and a declared-not-attested jurisdiction attribute for residency-aware routing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pierre Samson" },
    { name = "Claude Opus" },
]
keywords = ["swarph", "llm", "mesh", "cli", "multi-llm", "gemini", "claude", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "swarph-shared>=0.2.0",
    "pydantic>=2.0",
    # Phase 1 — Gemini adapter wraps the bridge (PLAN.md §3 ship order #1)
    "langgraph-genai-bridge>=0.1.5",
    "langchain-core>=0.3",
    # Phase 3 — MeshClient async HTTP wrapper (PLAN.md §5)
    "httpx>=0.27",
    # Phase 4 — OpenAI-compatible adapters (DeepSeek, OpenAI, Grok all
    # use the same client; Claude has its own SDK)
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/BrainSurfing-tech/swarph-mesh"
Source = "https://github.com/BrainSurfing-tech/swarph-mesh"
CLI = "https://github.com/BrainSurfing-tech/swarph-cli"
Plugin = "https://github.com/BrainSurfing-tech/swarph-meshlm"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0"]
typecheck = ["mypy>=1.10", "types-setuptools"]
# v0.7.3 — Sphinx auto-docs + GH Pages. Pinned conservatively; we can
# loosen as the doc build stabilizes. furo for theme + myst-parser so
# CHANGELOG.md / DEPRECATIONS.md / SECURITY.md (markdown) include cleanly.
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
]

# NOTE: this repo is the substrate Python package only — pure library.
# The `swarph` CLI binary lives in `BrainSurfing-tech/swarph-cli`; the Simon
# Willison `llm` plugin in `BrainSurfing-tech/swarph-meshlm`. All three import
# from this package as the bottom layer.

[tool.setuptools.packages.find]
where = ["src"]

# v0.7.0 — PEP 561 marker so third-party type-checkers see our types.
[tool.setuptools.package-data]
swarph_mesh = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Test the TREE, not whatever swarph_mesh happens to be installed. Without this
# pytest imports site-packages, so the suite validates the last INSTALLED
# version while you edit the source — and modules that exist only in the tree
# (every CLI adapter, the whole registry package) abort collection outright.
# Measured 2026-08-03 on a dev box: installed 0.7.4 vs tree 0.7.9, 11 test
# modules uncollectable, the run Interrupted — local `pytest` could not pass or
# fail, only abort. Same defect fixed in swarph-cli days earlier.
pythonpath = ["src"]


# v0.7.0 — mypy strict gate on the public Protocol surface.
# Third-party node-implementer-facing modules MUST type-check
# under --strict. Adapter implementations and tests can relax (they
# call into vendor SDKs whose stubs vary by SDK version).
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

# Adapter implementations + tests skip strict typing for now; the gate
# is the public contract surface. This list grows as we tighten over
# time (DEPRECATIONS.md anchored).
[[tool.mypy.overrides]]
module = "swarph_mesh.adapters.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Vendor SDKs whose type stubs aren't published or are inconsistent.
[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph_genai_bridge.*"
ignore_missing_imports = true
