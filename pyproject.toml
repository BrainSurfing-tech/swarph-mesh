[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarph-mesh"
version = "0.6.2"
description = "Model-agnostic Python substrate for the swarph-mesh ecosystem. v0.6.2 OpenAI full-pricing catch-up + drop's #745 carry-forwards: corrects o3 4x over-attribution (was 10/40, real 2/8), adds gpt-5.1/5.4/5.5 families + gpt-5-pro + o1-pro + o3-pro from authoritative openai.com/api/pricing source, centralizes normalizers + adds shared retirement registry pattern."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pierre Samson" },
    { name = "Claude Opus" },
]
keywords = ["swarph", "llm", "mesh", "cli", "multi-llm", "gemini", "claude", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "swarph-shared>=0.2.0",
    "pydantic>=2.0",
    # Phase 1 — Gemini adapter wraps the bridge (PLAN.md §3 ship order #1)
    "langgraph-genai-bridge>=0.1.5",
    "langchain-core>=0.3",
    # Phase 3 — MeshClient async HTTP wrapper (PLAN.md §5)
    "httpx>=0.27",
    # Phase 4 — OpenAI-compatible adapters (DeepSeek, OpenAI, Grok all
    # use the same client; Claude has its own SDK)
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/darw007d/swarph-mesh"
Source = "https://github.com/darw007d/swarph-mesh"
CLI = "https://github.com/darw007d/swarph-cli"
Plugin = "https://github.com/darw007d/swarph-meshlm"
Spec = "https://github.com/darw007d/hedge-fund-mcp/blob/main/research/swarph_cli/PLAN.md"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# NOTE: this repo is the substrate Python package only — pure library.
# The `swarph` CLI binary lives in `darw007d/swarph-cli`; the Simon
# Willison `llm` plugin in `darw007d/swarph-meshlm`. All three import
# from this package as the bottom layer.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
