# v0.7.3 — Sphinx auto-docs build + GitHub Pages deploy.
#
# On every push to main, builds the Sphinx site and deploys to gh-pages.
# On PRs, builds only (no deploy) so PR reviewers see whether the docs
# build is green before merge.
#
# Strict mode: SPHINXOPTS=-W --keep-going treats warnings as errors so
# autodoc misses (missing docstring on a public symbol, broken intersphinx
# link) fail the build instead of silently rotting.

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]

      - name: Build Sphinx HTML
        env:
          SPHINXOPTS: "-W --keep-going"
        run: |
          cd docs && make html

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
